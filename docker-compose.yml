services:
  database:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mythic}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mythic}
      POSTGRES_DB: ${POSTGRES_DB:-mythic_tracker}
    ports:
      - "5432:5432"
    volumes:
      - mythic-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-mythic}:${POSTGRES_PASSWORD:-mythic}@database:5432/${POSTGRES_DB:-mythic_tracker}?schema=public
    ports:
      - "3000:3000"
    depends_on:
      database:
        condition: service_healthy
    init: true
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    command: ["sh", "-c", "npm run db:deploy && npm run start:api"]

volumes:
  mythic-postgres:
